<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Arrows — Maze Puzzle</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ===== Level-select / home screen ===== -->
<div id="homeScreen" class="screen">
  <header class="home-header">
    <h1>Arrows</h1>
    <p class="tagline">Trace the path. Follow the arrows.</p>
  </header>
  <div id="levelGrid" class="level-grid"></div>
</div>

<!-- ===== Game screen ===== -->
<div id="gameScreen" class="screen hidden">
  <header class="game-header">
    <button id="backBtn" class="icon-btn" title="Back to levels" aria-label="Back">
      <svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="title-block">
      <div id="levelTitle" class="level-title">Level 1</div>
      <div id="difficultyLabel" class="difficulty-label">Easy</div>
    </div>
    <div class="header-icons">
      <button id="themeBtn" class="icon-btn" title="Theme" aria-label="Theme">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20c1.4 0 2.2-1 2.2-2 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-1 .8-1.8 1.8-1.8H17a4 4 0 004-4c0-5-4.5-9.8-9-9.8z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="7.2" cy="12" r="1.15" fill="currentColor" stroke="none"/><circle cx="9.5" cy="7.5" r="1.15" fill="currentColor" stroke="none"/><circle cx="14.5" cy="7" r="1.15" fill="currentColor" stroke="none"/><circle cx="17" cy="11" r="1.15" fill="currentColor" stroke="none"/></svg>
      </button>
      <button id="settingsBtn" class="icon-btn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24"><path d="M12 2l8.6 5v10L12 22l-8.6-5V7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      </button>
    </div>
  </header>

  <div class="hud">
    <div id="dropCount" class="drops"></div>
    <button id="hintBtn" class="hint-btn" title="Hint">
      <svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.5 10.9c.5.4.8 1 .8 1.6V16h5.4v-.5c0-.6.3-1.2.8-1.6A6 6 0 0012 3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span id="hintAdBadge" class="ad-badge hidden">AD</span>
    </button>
  </div>

  <div class="board-wrap">
    <canvas id="mazeCanvas"></canvas>
  </div>

  <div id="toast" class="toast hidden"></div>
</div>

<!-- ===== Win overlay ===== -->
<div id="winOverlay" class="overlay hidden">
  <div class="overlay-card">
    <div class="gem-big">◆</div>
    <h2>Level Complete!</h2>
    <p id="winLevelText"></p>
    <div class="overlay-actions">
      <button id="nextLevelBtn" class="primary-btn">Next Level →</button>
      <button id="winMenuBtn" class="secondary-btn">Level Select</button>
    </div>
  </div>
</div>

<!-- ===== Settings modal ===== -->
<div id="settingsModal" class="overlay hidden">
  <div class="overlay-card">
    <h2>Settings</h2>
    <label class="setting-row">
      <span>Sound</span>
      <input type="checkbox" id="soundToggle" />
    </label>
    <button id="resetBtn" class="secondary-btn danger">Reset Progress</button>
    <button id="closeSettingsBtn" class="primary-btn">Close</button>
  </div>
</div>

<!-- ===== Ad simulation overlay ===== -->
<div id="adOverlay" class="overlay hidden">
  <div class="overlay-card ad-card">
    <div class="spinner"></div>
    <p>Watching ad for a bonus drop…</p>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
